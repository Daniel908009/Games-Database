<!doctype html>
<html data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Game Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'games/css/theme.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg shadow-sm site-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'games:home' %}">Game Library</a>
      <form class="d-none d-lg-flex ms-4 me-auto" method="get" action="{% url 'games:search' %}">
        <input class="form-control form-control-sm" type="search" name="q" placeholder="Search games, studios, users" aria-label="Search">
      </form>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="theme-toggle" class="btn btn-sm btn-outline-light" title="Toggle light/dark">🌙</button>
        <a class="btn btn-outline-light btn-sm" href="{% url 'games:studios' %}">Studios</a>
        {% if user.is_authenticated %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'games:profile' %}">Profile</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning btn-sm">Logout</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
          <a class="btn btn-warning btn-sm" href="{% url 'games:register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-5">
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="alert alert-info mb-2">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'games/js/theme.js' %}"></script>
</body>
</html>
